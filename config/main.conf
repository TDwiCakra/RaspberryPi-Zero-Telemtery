# =============================================================================
# /etc/mavlink-router/main.conf
# MAVLink Router configuration for Raspberry Pi Zero 2W + Pixhawk
#
# Replace "100.x.x.x" with your GCS laptop's Tailscale IP address.
# Find it at: https://login.tailscale.com/admin/machines
# or by running: tailscale ip  (on your GCS laptop)
# =============================================================================

[General]
TcpServerPort=5760

[UartEndpoint pixhawk]
Device = /dev/ttyAMA0
Baud = 57600

[UdpEndpoint gcs]  #You can add multiple gcs EndPoints 
Address = 100.x.x.x
Port = 14550
